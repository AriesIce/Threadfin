name: Build and Push ARM64 Image

on:
  workflow_dispatch: # 允许手动触发
  push:
    tags:
      - 'v*'       # 推送 v 开头的 tag 时自动触发

env:
  IMAGE_NAME: threadfin-arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. 检出代码 (升级到 v5)
      - name: Checkout code
        uses: actions/checkout@v5

      # ✅ 2. 设置 QEMU (支持多架构模拟，升级到 v4)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ✅ 3. 设置 Docker Buildx (构建引擎，升级到 v4)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ✅ 4. 登录 Docker Hub (升级到 v4)
      # ⚠️ 确保你在仓库 Settings -> Secrets 中配置了 DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ 5. 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64  # 指定构建 arm64 架构
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
